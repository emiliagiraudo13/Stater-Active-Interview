<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>My Story</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5f3;

    main {
max-width: 850px;
      margin: 40px auto;

    }

    }

      text-align: center;
    }

    .memory {

      padding: 25px;

    .memory img {
      display: block;
      width: 100%;

<body>
  <main>
    <a href="index.html">← Back to the board</a>
    <h1>My Story</h1>

    <div class="memory">
      <img src="Sisters.jpg" alt="A childhood photo of me with my two sisters">

      <h2>Growing up with my sisters</h2>
      <p>
        I’m the middle child of three sisters. My older sister and I loved dressing up our little sister
        like she was our real life American Girl doll. Being together made
        even ordinary days feel special!!
      </p>
    </div>
    <section class="memory" id="tennis">
  <h2>Tennis through my eyes</h2>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
    <img src="Tennis.jpg" alt="My dog watching tennis" style="height: 280px; object-fit: contain;">
    <img src="IMG_4752.JPG" alt="Time with my tennis team" style="height: 280px; object-fit: contain;">
    <img src="image000009.JPEG" alt="A moment with my teammates" style="height: 280px; object-fit: contain;">

</section>
