<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Story</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5f3;
      color: #333;
    }

    main {
max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    a {
      color: #76543e;
    }

    h1 {
      text-align: center;
    }

    .memory {
      margin-top: 35px;
      padding: 25px;
      background: white;
      border-radius: 16px;
    }

    .memory img {
      display: block;
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      border-radius: 12px;
    }

    .memory p {
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <a href="index.html">← Back to the board</a>
    <h1>My Story</h1>

    <div class="memory">
      <img src="Sisters.jpg" alt="A childhood photo of me with my two sisters">

      <h2>Growing up with my sisters</h2>
      <p>
        I’m the middle of three sisters, and we always found a way to make
        things fun. My older sister and I loved dressing up our little sister
        like she was our real life American Girl doll. Being together made
        even ordinary days feel special.
      </p>
    </div>
  </main>
</body>
</html>
